[package]
name = "gpio-llm"
version = "0.1.0"
edition = "2021"
description = "Comandi in linguaggio naturale -> LLM locale -> validazione -> GPIO (Raspberry Pi)"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
rppal = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
